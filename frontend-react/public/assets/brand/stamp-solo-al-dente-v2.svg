    <ellipse cx="140" cy="65" rx="122" ry="44" fill="none" stroke="#C63028" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>
  <text x="140" y="66" text-anchor="middle" font-family="'DM Sans', 'Segoe Script', 'Comic Sans MS', cursive" font-weight="700" font-style="italic" font-size="42" fill="#C63028" style="letter-spacing:-0.02em">Solo al dente</text>
  <text x="140" y="98" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="600" font-size="11" fill="#C63028" style="letter-spacing:0.32em">ALGER — HYDRA</text>
