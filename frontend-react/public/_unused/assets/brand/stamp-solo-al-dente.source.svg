  <path d="M234 603 C248 424 482 306 880 298 C1269 291 1525 404 1558 588 C1586 756 1338 901 909 907 C492 912 219 794 234 603 Z" fill="none" stroke="#F5EFE4" stroke-width="4" opacity=".64"/>
  <g fill="#F5EFE4" text-anchor="middle" filter="url(#inkTexture)">
