<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero asset preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #202913; color: #f5efe4; font: 14px Arial, sans-serif; }
    main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(245, 239, 228, .2); }
    figure { position: relative; min-height: 420px; margin: 0; display: grid; place-items: center; overflow: hidden; background: #2c351d; }
    figure:nth-child(even) { background: #f5efe4; color: #202913; }
    figure:nth-child(2) { background: #2c351d; color: #f5efe4; }
    img { max-width: 86%; max-height: 350px; object-fit: contain; }
    .palm img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; opacity: .55; object-fit: cover; }
    .frieze { grid-column: 1 / -1; min-height: 260px; background: #f5efe4; }
    .frieze img { width: 94%; max-width: none; max-height: 210px; }
    figcaption { position: absolute; left: 18px; bottom: 16px; padding: 6px 9px; background: rgba(0, 0, 0, .68); color: white; }
  </style>
</head>
<body>
  <main>
    <figure class="palm"><img src="palm-shadow-diffuse.png" alt=""><figcaption>palm-shadow-diffuse.png</figcaption></figure>
    <figure><img src="box-pomodoro-steam.png" alt=""><figcaption>box-pomodoro-steam.png</figcaption></figure>
    <figure><img src="spaghetti-swirl-lineart.png" alt=""><figcaption>spaghetti-swirl-lineart.png</figcaption></figure>
    <figure><img src="basil-leaf-big-lineart.png" alt=""><figcaption>basil-leaf-big-lineart.png</figcaption></figure>
    <figure><img src="tomato-big-lineart.png" alt=""><figcaption>tomato-big-lineart.png</figcaption></figure>
    <figure><img src="stamp-solo-al-dente.png" alt=""><figcaption>stamp-solo-al-dente.png</figcaption></figure>
    <figure class="frieze"><img src="hero-frieze-cut.png" alt=""><figcaption>hero-frieze-cut.png</figcaption></figure>
  </main>
</body>
</html>
