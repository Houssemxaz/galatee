    <script>
      (function () {
        var splash = document.getElementById("pbg-splash");
        if (!splash) return;
        function hide() {
          splash.classList.add("pbg-splash-out");
          setTimeout(function () { splash.remove(); }, 340);
        }
        if (document.readyState === "complete") {
          hide();
        } else {
          window.addEventListener("load", hide, { once: true });
        }
        setTimeout(hide, 2500);
      })();
    </script>
