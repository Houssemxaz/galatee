<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" role="img" aria-label="Solo al dente — Alger Hydra">
  <defs>
    <filter id="stamp-rough-v2" x="-3%" y="-8%" width="106%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
